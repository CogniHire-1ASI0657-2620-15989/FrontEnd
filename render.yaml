services:
  - type: web
    name: pathbridge-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: VITE_USE_MOCK
        value: "false"
      # URL publica HTTPS del API Gateway, terminada en /api/v1.
      - key: VITE_API_URL
        value: https://depilugfz8.execute-api.us-east-1.amazonaws.com/api/v1
