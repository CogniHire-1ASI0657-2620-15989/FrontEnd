server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite assets have content hashes, so they can be cached for a long time.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fetch the latest entrypoint after deploying a new version.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vue Router handles application routes, including direct visits and reloads.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
